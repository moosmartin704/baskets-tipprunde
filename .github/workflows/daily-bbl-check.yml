name: Stündlicher BBL-Abgleich

# Läuft jede volle Stunde (GitHub Actions kennt nur UTC-Cron, daher "0 * * * *"
# statt einer lokalen Uhrzeit - das ist hier aber egal, da ohnehin stündlich
# geprüft wird). Für ein öffentliches Repo sind GitHub-Actions-Minuten
# unbegrenzt und kostenlos, der Lauf dauert nur ca. 20 Sekunden - stündlich
# statt täglich kostet also nichts extra, sorgt aber dafür, dass Ergebnisse
# spätestens eine Stunde nach Abpfiff automatisch eingetragen werden (ein
# fester Versatz wie "2,5 Std. nach Anpfiff" wäre ungenauer, da Spiele durch
# Verlängerung o. Ä. unterschiedlich lange dauern - und mit Cron ohnehin nicht
# pro Spiel, sondern nur zu festen Uhrzeiten planbar). Außerhalb der
# Spielzeiten findet der Job einfach nichts zu tun und beendet sich sofort.
# Über "workflow_dispatch" lässt sich der Job auch jederzeit manuell auslösen
# (z. B. zum Testen), unter dem Reiter "Actions" im GitHub-Repo.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abhängigkeiten installieren
        working-directory: scripts/daily-bbl-check
        run: npm install

      - name: Abgleich ausführen
        working-directory: scripts/daily-bbl-check
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: node check.mjs
