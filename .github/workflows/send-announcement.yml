name: Ankündigung verschicken

# Manuell auslösbar unter dem Reiter "Actions" im Repo ("Run workflow"), kein
# Zeitplan - bewusst ein manueller Schritt, damit keine Nachricht versehentlich
# an alle Geräte rausgeht. Titel/Text lassen sich beim Auslösen anpassen, die
# Vorbelegung ist die Saison-2026/2027-Begrüßung.
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Titel der Push-Nachricht"
        required: true
        default: "🏀 Willkommen zur Saison 2026/2027!"
      body:
        description: "Text der Push-Nachricht"
        required: true
        default: "Herzlich willkommen zur Baskets Tipprunde der easyCredit BBL! Wir wünschen euch viel Spaß und gute Tipps in dieser Saison 🍀"
      target:
        description: "Nur an eine Person schicken (Anzeigename, z.B. „Lucas“) - leer lassen für alle"
        required: false
        default: ""

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abhängigkeiten installieren
        working-directory: scripts/send-announcement
        run: npm install

      - name: Ankündigung verschicken
        working-directory: scripts/send-announcement
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          ANNOUNCE_TITLE: ${{ github.event.inputs.title }}
          ANNOUNCE_BODY: ${{ github.event.inputs.body }}
          ANNOUNCE_TARGET: ${{ github.event.inputs.target }}
        run: node announce.mjs
